# ===== チーム全体の設定（ここを自分の案件に書き換えて使う） =====

site:
  name: "在宅ワーク道具箱"
  # GitHub Pages の公開URL（例: https://ユーザー名.github.io/リポジトリ名）
  url: "https://phaedla0305-oss.github.io/zaitaku-toolbox"
  # GA4 の測定ID（空なら計測タグを出さない）
  ga4_id: "G-FBRPJZTEH7"
  # Google Search Console の所有権確認コード（「HTMLタグ」方式の content="..." の中身）
  gsc_verification: ""
  author: "編集部"

# 収益目標（週次レポートで達成に必要な数字を逆算する）
goal:
  monthly_revenue: 100000

# 週次マーケットリサーチ（Claude の Web 検索。1回あたり約0.01ドル＋処理料金）
research:
  max_searches: 8
  # 記事執筆時に Claude が事実確認で使う Web 検索の上限回数
  article_searches: 6

# 何のジャンルで、誰に向けて書くか（企画AIの前提になる）
niche: "在宅ワーク・リモートワークを快適にするガジェットとWebサービス"
target: "在宅勤務が週3日以上ある25〜45歳の会社員・フリーランス"

plan:
  ideas_per_run: 10   # ChatGPT が出すアイデア数
  plans_per_run: 2    # Claude が企画書に落とす本数

# ASP で提携済みの案件（url は ASP 管理画面で発行した広告リンクを貼る）
programs:
  - id: myip
    name: "マイIP（株式会社インターリンク）"
    asp: "A8.net"
    url: "https://px.a8.net/svt/ejp?a8mat=4BGFJG+CJW0XE+7QW+2HB8GI"
    reward: "契約 1件 1,000円（マイIP / マイIPソフトイーサ版 / セカイVPN）"
    rules: >-
      日本の固定IPで自宅・出先・海外からVPN接続できる個人向けサービス。
      リスティング広告は禁止。悪戯・虚偽・重複・不正、見積書発行からの申込み、スパム行為は否認。
      料金・仕様は公式サイトの記載に従い、断定や誇張をしない。法人向けのグループ専用VPNは紹介しない
    # 公式サイトで確認済みの事実（記事はこれを出典付きで使う。確認日を必ず併記）
    facts:
      checked: "2026-11-07"
      source: "https://www.interlink.or.jp/service/myip/"
      items:
        - "料金: 初期費用無料、月額1,100円（税込）。ソフトイーサ版は固定IP1つあたり月額1,320円（税込）（https://www.interlink.or.jp/service/myip/price.md?view）"
        - "無料体験: 「最大2ヶ月の無料体験あり」と案内（詳細条件は公式サイトで確認と書く）"
        - "固定IP: 日本の固定IPアドレス1個"
        - "接続方式: PPTP / L2TP / IKEv2 / WireGuard。専用アプリ「マイIPアプリ」は PPTP/L2TP/IKEv2 のみ対応"
        - "対応OS: Windows・macOS・iOS・Android・Linux・FreeBSD・Chrome OS（OSごとに使える方式が異なる。Android 12以降は L2TP 不可）"
        - "支払い方法: クレジットカード・NTT支払い・口座振替"
        - "解約: 公式FAQで退会方法を案内。特定商取引法表記では返品は原則不可"
        - "注意書き: 特定のサイトやサービスにアクセスできない国からの利用はサポート外。ネットワーク構成により使えない場合があり、無料体験中に確認するよう案内。VPNサーバー経由のため実効速度が低下する場合がある"
        - "同時接続: 公式FAQ「マイIPは複数人で同時に利用できますか？」で、固定IPを使うため複数の端末で同時に接続することはできず、最初に接続した方が優先されると案内（https://faq.interlink.or.jp/faq2/View/md.aspx?id=1270&view）。複数端末で同時に使うには法人向けのグループ専用VPNが必要とされている"
        - "活用事例: 公式の活用事例ページ（https://www.interlink.or.jp/service/myip/case.html）に、テレワークやサーバーメンテナンス（会社やクライアントのサーバーへSSH・FTPなどで接続）、ホームページの更新（WordPress管理画面のIP制限）、各種システムへのアクセス制限、公衆Wi-Fi利用時の接続が掲載されている。ただし業務利用の可否・規約上の条件は明記されていないので『問い合わせで確認』と併記する"
        - "公式サイトに記載がない（＝記事では『公式サイトに記載なし、問い合わせで確認』と書く）: 通信ログの保存方針、返金保証、業務利用の可否（規約上の条件）、固定IPが利用者専用かどうか、無料体験中のIPを本契約後も使えるか"
        - "運営: 株式会社インターリンク（東京都豊島区東池袋3-1-1 サンシャイン60 45F）"
        - "関連サービス: セカイVPN（日本・アメリカ・ドイツなど複数の国のIPを使える別サービス）"

  - id: gmo-homewifi
    name: "とくとくBBホームWi-Fi（GMOインターネット株式会社）"
    asp: "A8.net"
    url: "https://px.a8.net/svt/ejp?a8mat=4BGGBK+5LTYUQ+50+7LVLZM"
    reward: "新規利用 1件 5,100円（A8.net 確定率 約86%）"
    rules: >-
      工事不要・コンセントに挿すだけのホームルーター（WiMAX回線）。在宅ワークの自宅回線の見直し、光回線が引けない・工事を待てない人向け。
      リスティング広告は禁止。ステマ規制（景品表示法の指定告示）に未対応の場合は否認。1世帯2回以上・法人・不正な申込は否認。
      キャッシュバックなどの特典は時期で変わるため、金額を記事に書かず「最新の特典は公式サイトで確認」と書く。
      「速度制限がない」「どこでも使える」など誤解を招く表現をしない（大量通信時の速度制限の注意書きがある）
    facts:
      checked: "2026-11-08"
      source: "https://gmobb.jp/gmohomewifi/"
      items:
        - "工事不要。端末にSIMカードを入れてコンセントに挿すだけで使える"
        - "端末: ZTE Speed Wi-Fi HOME 5G L13（WiMAX。au 5G / au 4G LTE / WiMAX 2+、受信最大4.2Gbps、同時接続32台）。5Gは一部エリアで提供"
        - "データ量無制限とうたうが、一定期間内に大量のデータ通信をした場合、混雑する時間帯の通信速度を制限する場合があると注記"
        - "発送: 平日15時30分、土日祝14時までの申込完了で最短即日発送（在庫状況により停止の場合あり）"
        - "費用: 入会費0円、解約違約金なし、送料0円、事務手数料3,300円（税込）"
        - "端末代金33,264円（税込）は36回分割。分割相当分（月額924円）を割り引いた月額料金になると説明（端末代が実質0円になる利用期間は公式ページ内に24か月と36か月の両方の表記があるため、記事では『公式サイトで確認』と書く）"
        - "月額料金は公式ページの画像で『月額5,170円（税抜）（税込5,687円）』と表示（記事に書く場合は確認日を併記し、最新は公式サイトで確認と書く）"
        - "プラスエリアモードを使った月は別途1,100円（税込）"
        - "登録先住所以外でも使えると公式ページの比較表に記載"
        - "契約期間中いつでも違約金なしでとくとくBB光へ乗り換えられる『いつでもあんしん乗り換え保障』がある"
        - "公式サイトで確認できなかった（＝記事では『公式サイトで確認』と書く）: 途中解約時の端末残債の扱いの詳細、エリアごとの実効速度"

# 法令・ASP規約チェック（compliance.py が機械チェックする表現）
compliance:
  pr_label: "本ページはプロモーション（アフィリエイト広告）を含みます。"
  sns_tags: ["#PR", "#広告"]
  ng_patterns:
    - { pattern: "絶対(に)?(痩せ|治|稼げ|儲か|効)", level: critical, reason: "効果の断定（景表法・薬機法）" }
    - { pattern: "必ず(痩せ|治|稼げ|儲か|効)", level: critical, reason: "効果の断定（景表法・薬機法）" }
    - { pattern: "(完治|治る|治ります|治療でき)", level: critical, reason: "医薬品的な効能表現（薬機法）" }
    - { pattern: "副作用(が|は)?(ない|なし|ゼロ)", level: critical, reason: "安全性の断定（薬機法）" }
    - { pattern: "誰でも(簡単に)?(稼げ|儲か)", level: critical, reason: "収益の断定（景表法）" }
    - { pattern: "(No\\.?1|ナンバーワン|業界一|日本一|世界一)", level: warn, reason: "No.1表示は客観的根拠と出典の明記が必要" }
    - { pattern: "(最安|最安値|業界最安)", level: warn, reason: "最安表示は調査日・範囲の明記が必要" }
    - { pattern: "100\\s*[%％]", level: warn, reason: "100%表現は根拠が必要" }

sns:
  platform: x
  # 投稿に使う X アカウント
  handle: "@zaitaku_toolbox"
  # true なら実際に投稿する（X の API キーが未登録のときは投稿キュー作成に自動で切り替わる）
  live: true

github:
  # 実装タスクを割り当てる Copilot coding agent のアサイン名
  copilot_assignee: "@copilot"

# ===== 自動化（AIへの権限委譲） =====
automation:
  # 企画 Issue を人の承認なしで制作に回す
  auto_approve_plans: true
  # 法令チェックが完全にクリーンな記事は PR を自動マージ（＝自動公開）する
  # critical / warn / 「要確認」コメントが1つでも残る記事は自動公開せず、あなたの確認待ちになる
  auto_merge: true
  # 自動公開モードでは記事に体験談を書かせない（体験の捏造はステマ・優良誤認のリスクが高いため）
  no_experience_claims: true
  # AI に送るプロンプトに次の情報が含まれていたら送信を止め、あなたの確認待ちにする
  block_sensitive_in_prompts: true
