# ⑥ 効果測定: 毎週日曜に CSV を集計し、Claude が分析 → 改善 Issue（記事）と実装 Issue（Copilot）を起票
# CSV は data/metrics/ga/ と data/metrics/asp/ に置いて push する（GA4・ASPの管理画面からエクスポート）
name: 6. 効果測定
on:
  schedule:
    - cron: "0 22 * * 0"   # 月曜 7:00 JST（企画の2時間前 → 学びが企画に反映される）
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: GA4 の鍵を一時ファイルに書き出す（ジョブ終了で消える）
        env:
          GA4_SA_KEY: ${{ secrets.GA4_SA_KEY }}
        run: |
          if [ -n "$GA4_SA_KEY" ]; then
            printf '%s' "$GA4_SA_KEY" > "$RUNNER_TEMP/ga4-key.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga4-key.json" >> "$GITHUB_ENV"
          fi
      - run: python -m affteam measure
        env:
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # データが十分なときだけ Claude を1回呼ぶ（それ以上は止める）
          AFF_MAX_API_CALLS: "1"
          # Copilot への割り当てはユーザー権限が必要なため、Copilot 契約者の PAT（AUTOMATION_TOKEN）を使う
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/metrics && git commit -m "週次レポート $(date +%F)" && { for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done; } || echo "変更なし（または送信失敗）"
