# ⑥ 効果測定: 毎週日曜に CSV を集計し、Claude が分析 → 改善 Issue（記事）と実装 Issue（Copilot）を起票
# CSV は data/metrics/ga/ と data/metrics/asp/ に置いて push する（GA4・ASPの管理画面からエクスポート）
name: 6. 効果測定
on:
  schedule:
    - cron: "0 22 * * 0"   # 月曜 7:00 JST（企画の2時間前 → 学びが企画に反映される）
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m affteam measure
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Copilot への割り当てはユーザー権限が必要なため、Copilot 契約者の PAT（AUTOMATION_TOKEN）を使う
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports && git commit -m "週次レポート $(date +%F)" && git push || echo "変更なし"
