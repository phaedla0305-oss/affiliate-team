# ① 企画: 毎週月曜 9:00 (JST) に ChatGPT→Claude で企画を作り Issue に起票
name: 1. 企画
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m affteam plan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # 自動承認ラベルで「2. 制作」を起動するため PAT を使う
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - name: 企画データを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plans && git commit -m "企画: $(date +%F)" && git push || echo "変更なし"
