# ① 企画: 月曜・木曜 9:17 (JST) に ChatGPT→Claude で企画を作り Issue に起票
#    実行するかは config.yaml の schedule で判定（11月は休止、12/1 から週2回）
name: 1. 企画
on:
  schedule:
    - cron: "17 0 * * 1"   # 月曜 9:17 JST
    - cron: "17 0 * * 4"   # 木曜 9:17 JST
  workflow_dispatch:
    inputs:
      auto_approve:
        description: "企画を自動承認して制作・公開まで進める"
        type: choice
        options: ["true", "false"]
        default: "true"
permissions:
  contents: write
  issues: write
  actions: read   # 当月の API 費用を実行ログから集計するため
jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 実行するか判定（休止期間・曜日）
        id: decide
        run: python -m affteam schedule-check
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - name: マーケットリサーチ（Claude + Web検索）
        if: steps.decide.outputs.research == 'true'
        run: python -m affteam research
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - run: python -m affteam plan
        if: steps.decide.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AFF_AUTO_APPROVE: ${{ github.event.inputs.auto_approve || 'true' }}
          # 自動承認ラベルで「2. 制作」を起動するため PAT を使う
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - name: 企画データを保存
        if: steps.decide.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/plans reports/research && git commit -m "調査・企画: $(date +%F)" && { for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done; } || echo "変更なし（または送信失敗）"
