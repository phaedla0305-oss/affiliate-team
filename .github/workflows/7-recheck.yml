# 確認待ちの記事PRを、Claude のレビュー込みでチェックし直す（記事を手直ししたあとに使う）
# 指摘0件なら自動マージ（→ 4. 公開）。残っていればPRに結果を書いて確認待ちのまま
name: 7. 再チェック
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "記事PRの番号"
        required: true
      slugs:
        description: "対象記事のslug（スペース区切り）。空ならブランチ名から判定"
        default: ""
      autofix:
        description: "指摘を自動修正して再レビューする（false=レビュー1回のみ）"
        type: choice
        options: ["true", "false"]
        default: "true"
      max_calls:
        description: "Claude API 呼び出しの上限（記事1本あたり）"
        default: "3"
permissions:
  contents: write
  pull-requests: write
jobs:
  recheck:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PR: ${{ github.event.inputs.pr }}
      # Claude API 呼び出しの上限（記事1本あたり。python の1回の実行ごとに数える）
      AFF_MAX_API_CALLS: ${{ github.event.inputs.max_calls || '3' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
          fetch-depth: 0
      - name: PRのブランチに切り替え
        id: pr
        env:
          SLUGS_IN: ${{ github.event.inputs.slugs }}
        run: |
          BR=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          git fetch origin "$BR" main && git checkout "$BR"
          S="${SLUGS_IN:-${BR#content/}}"
          echo "slugs=$S" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 最新の main（プログラム・案件の確認済み事実）を取り込む
        run: |
          git config user.name "affiliate-team-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit origin/main || { git merge --abort || true; echo "main の取り込みで競合（そのまま続行）"; }
      - name: 法令・規約チェック（機械 + Claude）と公開判定
        id: gate
        continue-on-error: true
        env:
          SLUGS: ${{ steps.pr.outputs.slugs }}
          AUTOFIX: ${{ github.event.inputs.autofix || 'true' }}
        run: |
          rc=0
          for s in $SLUGS; do
            if [ "$AUTOFIX" = "true" ]; then
              python -m affteam review --slug "$s" || rc=1
            else
              python -m affteam check --slug "$s" || true
              python -m affteam gate --slug "$s" || rc=1
            fi
          done
          exit $rc
      - name: 結果を反映
        env:
          SLUGS: ${{ steps.pr.outputs.slugs }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          git add content/articles reports/compliance && git commit -m "再チェック: $SLUGS" || true
          git push || true
          BODY="## 再チェック結果"
          for s in $SLUGS; do BODY="$BODY"$'\n\n'"$(cat reports/compliance/$s.md)"; done
          gh pr comment "$PR" --body "$BODY"
          if [ "$GATE" = "success" ]; then
            gh pr edit "$PR" --remove-label needs-review || true
            gh pr merge "$PR" --squash --delete-branch
            for s in $SLUGS; do python -m affteam a8-notice --slug "$s" || true; done
          fi
