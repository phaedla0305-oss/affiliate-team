# ③ チェック: 人や Copilot が記事を直した PR で、機械チェックを毎回かける（AIレビューは制作時に実施済み）
name: 3. 法令チェック
on:
  pull_request:
    paths: ["content/**", "config.yaml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m affteam check --no-ai
      - run: python -m affteam build
