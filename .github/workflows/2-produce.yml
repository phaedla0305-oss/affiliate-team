# ② 制作 + ③ チェック + 自動公開判定
# 企画 Issue に approved（自動承認モードでは AI が付ける）が付いたら記事と SNS 案を作って PR を出す。
# チェックが完全にクリーンなら自動マージ（→ 4. 公開 が走る）。指摘があれば needs-review を付けてあなたに割り当てる。
#
# AUTOMATION_TOKEN（あなたの fine-grained PAT）を使う理由:
#   GITHUB_TOKEN で行ったラベル付け・push・マージは次のワークフローを起動しないため。
name: 2. 制作
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  produce:
    if: github.event.label.name == 'approved' && contains(github.event.issue.labels.*.name, 'kikaku')
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 記事・SNS案を作成（Claude + ChatGPT）
        run: python -m affteam produce --issue "$ISSUE"
      - name: 対象記事を特定
        id: slug
        run: echo "slug=$(ls -t content/articles/*.md | head -1 | xargs basename -s .md)" >> "$GITHUB_OUTPUT"
      - name: 法令・規約チェック → 自動修正 → 再チェック → 公開判定（機械 + Claude）
        id: gate
        continue-on-error: true
        run: python -m affteam review --slug "${{ steps.slug.outputs.slug }}"
      - name: PR を作成し、自動マージ or 確認依頼
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          GATE: ${{ steps.gate.outcome }}
        run: |
          BR="content/$SLUG"
          git config user.name "affiliate-team-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add content reports
          git commit -m "記事: $SLUG"
          git push -u origin "$BR" --force
          gh label create content --force >/dev/null 2>&1 || true
          gh label create needs-review --color d93f0b --force >/dev/null 2>&1 || true
          URL=$(gh pr create --title "[記事] $SLUG" --label content \
            --body "$(printf 'Closes #%s\n\n%s' "$ISSUE" "$(cat reports/compliance/$SLUG.md)")")
          if [ "$GATE" = "success" ]; then
            gh pr merge "$URL" --squash --delete-branch
            echo "自動公開しました: $URL"
            python -m affteam a8-notice --slug "$SLUG" || true
          else
            gh pr edit "$URL" --add-label needs-review --add-assignee "${{ github.repository_owner }}"
            gh pr comment "$URL" --body "⚠️ 自動公開を止めました。指摘事項（上記）を確認し、問題なければマージしてください。"
          fi
