# ⑤ 販売（集客）: 公開が終わったら、毎日 1 件ずつ SNS で告知（既定は投稿キュー作成のみ）
name: 5. SNS告知
on:
  workflow_run:
    workflows: ["4. 公開"]
    types: [completed]
  schedule:
    - cron: "0 3 * * *"   # 毎日 12:00 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sns:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt tweepy
      - run: python -m affteam sns
        env:
          SNS_LIVE: ${{ vars.SNS_LIVE }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sns_posted.json reports && git commit -m "SNS告知 $(date +%F)" && git push || echo "変更なし"
